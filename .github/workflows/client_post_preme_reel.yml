name: "Post Preme Campaign Reel"

on:
  # Automated Schedule: Every 3 hours (8 reels per day)
  # Times in UTC: 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC
  # (IST: 05:30, 08:30, 11:30, 14:30, 17:30, 20:30, 23:30, 02:30)
  schedule:
    - cron: '0 */3 * * *'

  # Manual on-demand trigger via GitHub UI
  workflow_dispatch:

concurrency:
  group: preme-instagram-upload-queue
  cancel-in-progress: false

jobs:
  upload-preme-reel:
    name: "Upload Preme Reel to Instagram (@coool_verse_)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Cloud Reel Poster
        env:
          # Uses PREME_INSTA_SESSION_JSON if configured, otherwise falls back to INSTA_SESSION_JSON
          INSTA_SESSION_JSON: ${{ secrets.PREME_INSTA_SESSION_JSON != '' && secrets.PREME_INSTA_SESSION_JSON || secrets.INSTA_SESSION_JSON }}
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.PREME_GDRIVE_FOLDER_ID != '' && secrets.PREME_GDRIVE_FOLDER_ID || '1NuU7Jc3zLVnd08UZh6U-2QrlWxOmEWXr' }}
          GDRIVE_ARCHIVE_ID: ${{ secrets.PREME_GDRIVE_ARCHIVE_ID != '' && secrets.PREME_GDRIVE_ARCHIVE_ID || '1E3xbmMxuMykWskFagbQ155mn5Dq1QWfG' }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          python shared/cloud_post_reel.py
